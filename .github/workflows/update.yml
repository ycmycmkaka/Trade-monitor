name: Update Trade Exit Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "30 22 * * 1-5"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Update all trades through Supabase
        env:
          CRON_SECRET: ${{ secrets.TRADE_MONITOR_CRON_SECRET }}

        run: |
          curl --fail-with-body --retry 2 --retry-delay 5 \
            -X POST "https://ykxsvgtwbfxmjwrmqhmh.supabase.co/functions/v1/analyze-trade" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"mode":"all"}'
